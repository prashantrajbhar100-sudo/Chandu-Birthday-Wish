
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chandani ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Georgia, serif;
    color: white;
    text-align: center;
    overflow: hidden;

    background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("chandani.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 700px;
    padding: 30px 15px;

    background: rgba(0,0,0,0.30);
    border-radius: 25px;
    backdrop-filter: blur(5px);
}

h1 {
    font-size: 42px;
    margin-bottom: 15px;
    text-shadow: 0 3px 10px black;
}

.subtitle {
    font-size: 19px;
    margin-bottom: 30px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.box {
    width: 90px;
    padding: 15px 5px;

    background: rgba(255,255,255,0.20);
    border-radius: 15px;
}

.number {
    font-size: 30px;
    font-weight: bold;
}

.label {
    font-size: 10px;
    margin-top: 5px;
    letter-spacing: 1px;
}

.signature {
    margin-top: 30px;
    font-size: 18px;
    line-height: 1.6;
}

.signature b {
    font-size: 23px;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: up 5s linear forwards;
}

@keyframes up {
    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

@media (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 16px;
    }

    .box {
        width: 72px;
    }

    .number {
        font-size: 24px;
    }

    .signature {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Happy Birthday Chandani ❤️</h1>

    <div class="subtitle">
        Your special day is coming... 🎂✨
    </div>

    <div class="countdown">

        <div class="box">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

    <div class="signature">
        With Love ❤️<br>
        <b>Prashant Rajbhar</b>
    </div>

</div>

<script>

const birthday = new Date("November 20, 2026 00:00:00").getTime();

function countdown() {

    const now = new Date().getTime();
    const difference = birthday - now;

    if (difference <= 0) {
        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";
        return;
    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (difference % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (difference % (1000 * 60))
        / 1000
    );

    document.getElementById("days").innerHTML =
        String(days).padStart(2, "0");

    document.getElementById("hours").innerHTML =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2, "0");
}

countdown();

setInterval(countdown, 1000);


function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 800);

</script>

</body>
</html>
