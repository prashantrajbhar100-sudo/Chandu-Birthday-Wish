
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chandani ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    <div class="container">
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

/* Background Photo */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("chandani.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

/* Dark overlay */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: -1;
}

.container {
    width: 92%;
    max-width: 850px;
    padding: 35px 20px;
    border-radius: 30px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(5px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
    text-shadow: 0 4px 20px black;
}

.subtitle {
    font-size: 20px;
    margin-bottom: 30px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.box
